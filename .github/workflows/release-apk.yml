name: Release APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          # The full history is required: versionCode is derived from the
          # repository's commit count in the root build script.
          fetch-depth: 0

      - name: Install Android SDK packages
        # sdkmanager itself requires a modern JDK, so it runs before the build
        # JDK is pinned to 8 and with an explicit JAVA_HOME of its own.
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-28" "build-tools;28.0.3"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Generate an ephemeral signing key
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mozulu.jks" \
            -storetype JKS \
            -storepass mozulu-ci \
            -keypass mozulu-ci \
            -alias mozulu \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Mozulu, OU=Mozulu, O=Mozulu, L=Unknown, ST=Unknown, C=ZA"

      - name: Assemble release APK
        env:
          MOZULU_KEYSTORE_FILE: ${{ runner.temp }}/mozulu.jks
          MOZULU_KEYSTORE_PASSWORD: mozulu-ci
          MOZULU_KEY_ALIAS: mozulu
          MOZULU_KEY_PASSWORD: mozulu-ci
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Verify and describe the APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $APK"
          ls -l "$APK"
          sha256sum "$APK"
          "$ANDROID_SDK_ROOT/build-tools/28.0.3/apksigner" verify --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/28.0.3/aapt" dump badging "$APK" | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mozulu-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish the APK to a transport branch
        # Actions artifacts live on a storage host that some networks cannot
        # reach, so the build output is also pushed to a throwaway branch that
        # can be fetched with plain git. The branch holds a single commit and
        # can be deleted once the APK has been collected.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          STAGING="$RUNNER_TEMP/apk-transport"
          mkdir -p "$STAGING"
          cp "$APK" "$STAGING/"
          cp app/build/outputs/mapping/release/mapping.txt "$STAGING/" 2>/dev/null || true
          cd "$STAGING"
          git init -q
          git checkout -q -b ci-apk-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Release APK built from $GITHUB_SHA"
          git push -q --force "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" ci-apk-artifact
          echo "Pushed $(basename "$APK") to branch ci-apk-artifact"
